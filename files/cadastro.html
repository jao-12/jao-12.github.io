    <h2>Formulário de Elogios aos Skates</h2>
    <form action="#" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="elogio">Deixe seu elogio para nossos skates:</label><br>
        <textarea id="elogio" name="elogio" rows="5" cols="40" required></textarea><br><br>

        <button type="submit">Enviar Elogio</button>
    </form>

    <p><strong>Atenção:</strong> Caso haja reclamações, a pessoa responsável irá sumir misteriosamente.</p>
